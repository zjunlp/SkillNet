[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skillnet-ai"
version = "0.1.4"
description = "Official Python SDK for SkillNet: Create, Evaluate, and Connect AI Skills."
readme = "README.md"
authors = [{ name = "SkillNet Team", email = "liangyuannnnn@gmail.com" }]
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
requires-python = ">=3.10"
dependencies = [
    "requests>=2.32.5,<3",
    "openai>=1.109.1,<3",
    "pydantic>=2.12.5,<3",
    "tqdm>=4.67.1",
    "typer>=0.21.1,<1",
    "rich>=13.9.4",
    "PyPDF2>=3.0.1",
    "pycryptodome>=3.23.0",
    "python-docx>=1.2.0",
    "python-pptx>=1.0.2",
    "json-repair>=0.30.0",
    "PyYAML>=6.0,<7"
]

[project.optional-dependencies]
ui = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
claude = [
    "claude-agent-sdk>=0.2.110,<0.3",
]
codex = ["openai-codex>=0.144.4,<0.145"]
dsh = ["deepseek-harness-sdk>=0.2.1rc2,<0.3"]
graph = [
    "numpy>=1.24",
]
dev = ["pytest>=8,<10", "ruff>=0.12,<1", "mypy>=1.15,<3", "build>=1.2,<2",
       "types-PyYAML", "types-requests", "jsonschema>=4.20,<5"]

[project.urls]
"Homepage" = "http://skillnet.openkg.cn"
"Source" = "https://github.com/zjunlp/SkillNet"

[project.scripts]
skillnet = "skillnet_ai.interfaces.cli:app"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.setuptools.package-data]
"skillnet_ai.router" = ["dsh_wiki.mjs"]
"skillnet_ai.web" = ["static/**/*", "static/*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.mypy]
python_version = "3.10"
files = ["src/skillnet_ai/core/models.py", "src/skillnet_ai/analyzer.py",
         "src/skillnet_ai/core/llm.py", "src/skillnet_ai/core/library.py",
         "src/skillnet_ai/router", "src/skillnet_ai/web"]
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
follow_imports = "silent"

[[tool.mypy.overrides]]
module = ["claude_agent_sdk.*", "openai_codex.*", "deepseek_harness.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"
